services:
  - type: web
    name: chat-app-backend
    runtime: node
    rootDir: backend

    buildCommand: npm ci && npm run build
    startCommand: npm start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        sync: false

      - key: FRONTEND_URL
        sync: false